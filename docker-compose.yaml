version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: user-api.postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: userdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - user-api-network
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: user-api
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/userdb?sslmode=disable
      GIN_MODE: debug
      LOG_LEVEL: debug
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - user-api-network
    command: sh -c "sleep 5 && ./main"

networks:
  user-api-network:
    driver: bridge

volumes:
  postgres_data: